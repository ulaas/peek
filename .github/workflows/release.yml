# Builds Peek for Windows, Linux and macOS.
#
# Pushing a tag like v0.5.0 builds, tests and publishes a GitHub release with
# the notes from that version's CHANGELOG.md section. Running it by hand
# (Actions > Release > Run workflow) is a dry run: it builds and uploads the
# packages as workflow artifacts and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Build libopus from its vendored source and link it statically, so the
  # binaries do not depend on a system libopus.
  OPUS_BUNDLED: "1"
  OPUS_STATIC: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: peek-windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: peek-linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: peek-macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake nasm libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev rpm

      - name: Install NASM (faster H.264 encoding) and WiX (MSI installer)
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress && echo "C:/Program Files/NASM" >> "$GITHUB_PATH"
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools" && cygpath -w "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Test
        run: cargo test --workspace --locked

      - name: Use the static C runtime on Windows
        if: runner.os == 'Windows'
        # peek.exe then runs without the Visual C++ redistributable installed.
        run: |
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc=$(pwd -W)/packaging/windows/static-crt.cmake" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p peek --target ${{ matrix.target }}

      - name: Package
        run: bash scripts/package.sh ${{ matrix.target }} ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum peek-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## $version'"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          # A re-pushed tag reuses its release: refresh notes and replace assets.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Peek ${GITHUB_REF_NAME#v}" --notes-file notes.md "${flags[@]}"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Peek ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
