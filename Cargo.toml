[workspace]
resolver = "3"
members = ["crates/peek-core", "crates/peek-vnc"]


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
peek-core = { path = "crates/peek-core" }
peek-vnc = { path = "crates/peek-vnc" }
peek-rdp = { path = "crates/peek-rdp" }
peek-record = { path = "crates/peek-record" }
peek-store = { path = "crates/peek-store" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
bytemuck = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = "1"
zstd = "0.13"

# ---------------------------------------------------------------------------
# Build profiles. Tuned so dev builds are fast to run, quick to rebuild and
# small on disk:
#  * third-party deps are optimized (decoders/TLS run at real speed in dev)
#    and carry no debug info (debug info is the bulk of target/ size)
#  * our own crates keep line tables only, enough for usable backtraces
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false
incremental = false

# Decoders in our own crates are hot loops; optimize them even in dev.
[profile.dev.package.peek-vnc]
opt-level = 2
[profile.dev.package.peek-core]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false

[profile.test]
debug = "line-tables-only"
