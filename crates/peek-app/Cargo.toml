[package]
name = "peek"
description = "Peek remote desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "peek"
path = "src/main.rs"

[features]
# Test builds only, never a release: PEEK_UPDATE_FEED points the updater at a local server
# (see update::Source::test_feed), and PEEK_UPDATE_TEST_AUTO=1 starts the update it finds.
update-test-feed = []

[dependencies]
peek-core.workspace = true
peek-vnc.workspace = true
peek-rdp.workspace = true
peek-store.workspace = true
peek-audio.workspace = true
opus2 = "0.4"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
parking_lot.workspace = true
bytemuck.workspace = true
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence", "clipboard", "wayland", "x11"] }
egui = { version = "0.37", features = ["bytemuck"] }
peek-record = { path = "../peek-record", features = ["mp4"] }
rfd = "0.17"
arboard = { version = "3", default-features = false }
# Update check and self-update: a blocking HTTPS client on the rustls + ring already built for RDP,
# trusting the certificates of the operating system.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
flate2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Files opened from Finder arrive as an Apple Event on the application delegate (see src/macos.rs).
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
# Updates swap Peek.app in one rename (renamex_np) and wait for Peek to exit in a detached helper (setsid).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
