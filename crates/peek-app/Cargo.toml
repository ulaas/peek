[package]
name = "peek"
description = "Peek remote desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "peek"
path = "src/main.rs"

[dependencies]
peek-core.workspace = true
peek-vnc.workspace = true
peek-rdp.workspace = true
peek-store.workspace = true
peek-audio.workspace = true
opus2 = "0.4"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
parking_lot.workspace = true
bytemuck.workspace = true
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence", "clipboard", "wayland", "x11"] }
egui = { version = "0.37", features = ["bytemuck"] }
peek-record = { path = "../peek-record", features = ["mp4"] }
rfd = "0.17"
arboard = { version = "3", default-features = false }
# Update check and self-update: a blocking HTTPS client on the rustls + ring already built for RDP,
# trusting the certificates of the operating system.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
flate2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
