[package]
name = "peek"
description = "Peek remote desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "peek"
path = "src/main.rs"

[dependencies]
peek-core.workspace = true
peek-vnc.workspace = true
peek-rdp.workspace = true
peek-store.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
parking_lot.workspace = true
bytemuck.workspace = true
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
egui = { version = "0.37", features = ["bytemuck"] }
arboard = "3"
