[package]
name = "peek-record"
description = "Lossless session recording and playback for Peek"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
peek-core.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
zstd.workspace = true
peek-audio.workspace = true
opus2 = "0.4"
openh264 = { version = "0.9.9", optional = true }
mp4 = { version = "0.14.0", optional = true }

[features]
# H.264 / MP4 export (compiles Cisco OpenH264 from source).
mp4 = ["dep:openh264", "dep:mp4"]
